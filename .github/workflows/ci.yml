name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          cmk version
          cmk pr-checklist --lang en | head -n 5
          printf 'abc Add feature\n---\n' > /tmp/c.txt
          cmk release-notes --commits-file /tmp/c.txt --dry-run | head -n 5
          cmk doctor || true
