[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-maintainer-kit"
version = "0.1.0"
description = "Practical MIT toolkit for open-source maintainers using OpenAI Codex / ChatGPT Codex / OpenAI API (unofficial, not affiliated with OpenAI)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "codex-maintainer-kit contributors" }]
keywords = ["openai", "codex", "maintainer", "cli", "release-notes", "pr-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.0",
  "openai>=1.40.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
cmk = "cmk.cli:app"

[project.urls]
Homepage = "https://github.com/example/codex-maintainer-kit"
Documentation = "https://github.com/example/codex-maintainer-kit#readme"
Issues = "https://github.com/example/codex-maintainer-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cmk"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/prompts",
  "/README.md",
  "/LICENSE",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cmk"]
branch = true
